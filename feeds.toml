# The published feeds, one [[feed]] table each. A push to main republishes
# them; removing a feed stops publishing its file.
#
#   file          the file name under https://feeds.michelebologna.net/hackernews-rss/
#   title         the feed's title in the reader
#   tags          Algolia tags: front_page, story, show_hn, ask_hn, ...
#                 (comma-separated tags must all match). With front_page the
#                 feed follows the current front page; otherwise it takes the
#                 newest matching stories of the last window_hours.
#   min_points    only stories with at least this many points (default 0)
#   min_comments  only stories with at least this many comments (default 0)
#   window_hours  how long a story stays in the feed after it first matched
#                 (default 48); a story that still matches always stays
#   max_items     the most items the feed holds (default 150)
#   ranked        true: only stories in HN's current ranking (the ~500 ids of
#                 topstories.json), at any age (default false)

[[feed]]
file = "frontpage.xml"
title = "Hacker News: front page"
tags = "front_page"

[[feed]]
file = "best.xml"
title = "Hacker News: 100+ points"
tags = "story"
min_points = 100

# What the @hacker_news_feed Telegram bot (phil-r/hackernewsbot) posts: ranked
# stories with 150+ points, including older ones still ranked.
[[feed]]
file = "top.xml"
title = "Hacker News: top stories, 150+ points"
tags = "story"
min_points = 150
ranked = true
# About 170 of the ~500 ranked stories have 150+ points (2026-11-19): room
# for all of them, as the bot eventually posts every one.
max_items = 250

# One item per UTC day with that day's top stories by points.
#
#   file          the file name, as for [[feed]]
#   title         the feed's title
#   top           stories per day (default 20)
#   days          days kept (default 7)
#   publish_hour  the UTC hour of the next day when a day appears (default 6:
#                 07:00 in Rome in winter, by when late stories have scored)
[[digest]]
file = "digest.xml"
title = "Hacker News: daily digest"
